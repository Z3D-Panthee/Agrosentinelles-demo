<style>
:root{
  --bg: #010409;
  --panel: rgba(15, 23, 42, 0.75);
  --border: rgba(56, 189, 248, 0.4);
  --cyan: #38bdf8;
  --cyan-glow: rgba(56, 189, 248, 0.6);
  --gold: #facc15;
  --gold-glow: rgba(250, 204, 21, 0.6);
  --green: #4ade80;
  --purple: #a78bfa;
  --muted: #94a3b8;
  --main: #f8fafc;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--main);
  font-family:'Inter', system-ui, -apple-system, sans-serif;
  background: radial-gradient(circle at 50% -20%, #0f172a 0, var(--bg) 70%);
  min-height:100vh; padding-bottom:100px; overflow-x:hidden;
  perspective: 1200px;
}

/* HEADER HOLOGRAPHIQUE 3D */
.header{
  position:sticky; top:0; z-index:1000;
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 24px; background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(25px); border-bottom: 1px solid var(--border);
  box-shadow: 0 10px 40px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
}
.logo{display:flex; align-items:center; gap:14px;}
.pulse{
  width:14px; height:14px; background:var(--green); border-radius:50%;
  box-shadow: 0 0 20px var(--green), 0 0 40px var(--green);
  animation: pulse 2s infinite ease-in-out;
}
@keyframes pulse{0%{transform:scale(1);opacity:1} 50%{transform:scale(0.8);opacity:0.5} 100%{transform:scale(1);opacity:1}}

.title h1{
  margin:0; font-size:15px; font-weight:900; letter-spacing:1px;
  background:linear-gradient(90deg,#fff,var(--cyan),var(--gold));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  filter: drop-shadow(0 0 10px rgba(56,189,248,0.4));
}
.title span{font-size:9px; color:var(--gold); letter-spacing:1.8px; font-weight:800;}

.nav{display:flex; gap:8px; flex-wrap:wrap;}
.nbtn{
  background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(255, 255, 255, 0.08);
  color: var(--muted); padding: 8px 16px; border-radius: 12px;
  font-weight: 700; font-size: 11px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
}
.nbtn:hover{background: rgba(56, 189, 248, 0.2); color: #fff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56,189,248,0.3);}
.nbtn.active{
  background: linear-gradient(135deg, rgba(56,189,248,0.3), rgba(56,189,248,0.05));
  border-color: var(--cyan); color: var(--cyan);
  box-shadow: 0 0 25px var(--cyan-glow), inset 0 0 10px rgba(56,189,248,0.2);
}

.badge{
  background: linear-gradient(135deg, var(--gold), #ca8a04); color: #000;
  padding: 6px 14px; border-radius: 20px; font-size: 10px; font-weight: 900;
  box-shadow: 0 0 20px var(--gold-glow); text-transform: uppercase;
}

/* CONTAINER & CARTES 3D PRO MAX */
.container{max-width:1500px; margin:auto; padding:24px;}
.grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(330px, 1fr)); gap:22px;}

.card3d{
  background: var(--panel); backdrop-filter: blur(30px);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 26px; box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.08);
  position: relative; overflow: hidden;
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.4s ease;
}
.card3d::before{
  content:''; position:absolute; top:0; left:0; width:100%; height:3px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--gold), transparent);
  opacity: 0.8;
}
.card3d:hover{
  transform: translateY(-8px) rotateX(4deg) rotateY(-3deg) scale(1.02);
  box-shadow: 0 35px 90px rgba(56,189,248,0.25), inset 0 1px 0 rgba(255,255,255,0.2);
  border-color: rgba(56,189,248,0.7);
}

.metric{font-size:36px; font-weight:900; color:var(--cyan); margin:8px 0; text-shadow: 0 0 20px rgba(56,189,248,0.4);}
.muted{color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px;}

/* BOUTONS AVEC EFFETS DE PROFONDEUR */
.btn{
  border: none; border-radius: 12px; padding: 10px 18px; font-weight: 800; font-size: 12px;
  cursor: pointer; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
}
